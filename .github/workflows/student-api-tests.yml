name: Testes da API - Trabalho Final de Automação de Testes na Camada de Serviço (API)- Danielle Patricio 

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    # A API conecta no MongoDB ao iniciar (src/database/db.js) e popula o banco
    # com o seed usado pelos testes; sem este serviço ela não sobe.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir a API em segundo plano
        run: npm start > api.log 2>&1 &

      - name: Aguardar a API responder
        run: curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:3000/

      - name: Testes - Cadastrar novo aluno (admin)
        run: npm run test:cadastrar-aluno

      - name: Testes - Registrar entrega de trabalho (aluno)
        run: npm run test:registrar-entrega-trabalho

      - name: Log da API (em caso de falha)
        if: failure()
        run: cat api.log
